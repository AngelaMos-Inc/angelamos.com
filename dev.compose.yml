# =============================================================================
# AngelaMos | 2026
# dev.compose.yml
# =============================================================================
# Development compose - Nginx + Vite (HMR) + Go API (air) + Postgres + Redis
# Uses .env.development
# =============================================================================

name: 001-dev

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: 001-dev-nginx
    ports:
      - "${NGINX_HOST_PORT:-62106}:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/dev.nginx:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      frontend:
        condition: service_started
      api:
        condition: service_started
    networks:
      - app
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: ../infra/docker/vite.dev
    container_name: 001-dev-frontend
    # Install on every up so host-edited package.json is always honored
    # (the node_modules volume is seeded once otherwise). CI=true => no TTY prompt.
    command: sh -c "pnpm install && exec pnpm dev --host 0.0.0.0"
    environment:
      - CI=true
      - VITE_API_URL=${VITE_API_URL:-/api}
      - VITE_APP_TITLE=${VITE_APP_TITLE:-001 (Dev)}
    ports:
      - "${FRONTEND_HOST_PORT:-11849}:5173"
    volumes:
      - ./frontend:/app
      - frontend_modules:/app/node_modules
    networks:
      - app
    restart: unless-stopped

  api:
    build:
      context: ./backend
      dockerfile: ../infra/docker/go.dev
    container_name: 001-dev-api
    environment:
      - ENVIRONMENT=development
      - HOST=0.0.0.0
      - PORT=8080
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/app?sslmode=disable
      - REDIS_URL=redis://redis:6379/0
      - JWT_PRIVATE_KEY_PATH=keys/private.pem
      - JWT_PUBLIC_KEY_PATH=keys/public.pem
      - LOG_LEVEL=debug
      - LOG_FORMAT=text
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - CONTACT_TO_EMAIL=${CONTACT_TO_EMAIL:-carterperez@angelamos.com}
      - CONTACT_FROM_EMAIL=${CONTACT_FROM_EMAIL:-onboarding@resend.dev}
      - IG_USER_ID=${IG_USER_ID:-}
      - IG_ACCESS_TOKEN=${IG_ACCESS_TOKEN:-}
      - IG_GRAPH_VERSION=${IG_GRAPH_VERSION:-v22.0}
      - SOCIAL_POLL_INTERVAL=${SOCIAL_POLL_INTERVAL:-5m}
    ports:
      - "${API_HOST_PORT:-18080}:8080"
    volumes:
      - ./backend:/app
      - go_build_cache:/root/.cache/go-build
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app
    restart: unless-stopped

  postgres:
    image: postgres:18-alpine
    container_name: 001-dev-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
    ports:
      - "${DB_HOST_PORT:-54470}:5432"
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: 001-dev-redis
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_HOST_PORT:-63790}:6379"
    volumes:
      - redisdata_dev:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app
    restart: unless-stopped

networks:
  app:
    driver: bridge

volumes:
  frontend_modules:
  pgdata_dev:
  redisdata_dev:
  go_build_cache:
